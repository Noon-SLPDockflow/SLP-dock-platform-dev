    function debounce(func, wait) {
        let timeout;
        return function(...args) { clearTimeout(timeout); timeout = setTimeout(() => func.apply(this, args), wait); };

    function formatEnglishDate(dateObj) {
        if (!dateObj || isNaN(dateObj.getTime())) return "--";
        const mm = dateObj.getMonth() + 1;
        const dd = dateObj.getDate();
        const yyyy = dateObj.getFullYear();
        let hr = dateObj.getHours();
        const min = String(dateObj.getMinutes()).padStart(2, '0');
        const sec = String(dateObj.getSeconds()).padStart(2, '0');
        const ampm = hr >= 12 ? 'PM' : 'AM';
        hr = hr % 12 || 12;
        return `${mm}/${dd}/${yyyy}, ${hr}:${min}:${sec} ${ampm}`;
    }

    function parseFlexibleDate(val) {
        if (!val) return new Date(NaN);
        let s = String(val).trim();
        if (s.includes('T') && s.includes('Z')) return new Date(s);
        let d = new Date(s);
        if (!isNaN(d.getTime())) return d;
        const map = {'٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9'};
        s = s.replace(/[٠-٩]/g, m => map[m]);
        s = s.replace(/ص/gi, ' AM').replace(/م/gi, ' PM');
        s = s.replace(/،/g, ',').replace(/[\u200E\u200F\u202A-\u202E]/g, '');
        let parts = s.match(/(\d{4})\/(\d{1,2})\/.*?(\d{1,2}).*?(\d{1,2}):(\d{1,2}):(\d{1,2})\s*(AM|PM)/i);
        if (parts) return new Date(`${parts[2]}/${parts[3]}/${parts[1]} ${parts[4]}:${parts[5]}:${parts[6]} ${parts[7]}`);
        d = new Date(s);
        if (!isNaN(d.getTime())) return d;
        s = s.replace(/\s+AM/g, ' AM').replace(/\s+PM/g, ' PM');
        return new Date(s);
    }

    window.toggleLang = function(forceLang) {
        if (forceLang) currentLang = forceLang; else currentLang = currentLang === 'en' ? 'ar' : 'en';
        localStorage.setItem('noonSlpLang', currentLang);
        document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
        document.documentElement.lang = currentLang;
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (el.tagName === 'INPUT' && (el.type === 'text' || el.type === 'date')) el.placeholder = tr(key);
            else el.innerText = tr(key);
        });
        if (window.handleLogsResponse && globalLogsCache) window.handleLogsResponse({ logs: globalLogsCache });
    };

    function switchView(viewId, element) {
        document.querySelectorAll('.app-view').forEach(v => v.classList.remove('active-view'));
        const targetView = document.getElementById('view-' + viewId);
        if (targetView) targetView.classList.add('active-view');
        if (element) {
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            element.classList.add('active');
        }
        if (window.innerWidth <= 1200) {
            const sidebar = document.getElementById('appSidebar');
            if (sidebar) sidebar.classList.remove('mobile-open');
        }
    }
    window.switchView = switchView;

    function getAvailableViews() {
        let views = [];
        document.querySelectorAll('.nav-links .nav-item').forEach(item => {
            if (window.getComputedStyle(item).display !== 'none' && item.getAttribute('onclick')) {
                let match = item.getAttribute('onclick').match(/switchView\('([^']+)'/);
                if(match) views.push(match[1]);
            }
        });
        return views;
    }

    window.swipeNext = function() {
        let activeView = document.querySelector('.app-view.active-view'); if (!activeView) return;
        let currentId = activeView.id.replace('view-', '');
        let views = getAvailableViews();
        let idx = views.indexOf(currentId);
        if (idx >= 0 && idx < views.length - 1) {
            let nextView = views[idx + 1];
            let navItem = Array.from(document.querySelectorAll('.nav-item')).find(el => el.getAttribute('onclick') && el.getAttribute('onclick').includes(nextView));
            switchView(nextView, navItem);
        }
    };

    window.swipePrev = function() {
        let activeView = document.querySelector('.app-view.active-view'); if (!activeView) return;
        let currentId = activeView.id.replace('view-', '');
        let views = getAvailableViews();
        let idx = views.indexOf(currentId);
        if (idx > 0) {
            let prevView = views[idx - 1];
            let navItem = Array.from(document.querySelectorAll('.nav-item')).find(el => el.getAttribute('onclick') && el.getAttribute('onclick').includes(prevView));
            switchView(prevView, navItem);
        }
    };

        if (window.innerWidth <= 1200) {
            sidebar.classList.toggle('mobile-open');
        } else {
            sidebar.classList.toggle('hidden');
            const main = document.getElementById('mainContentArea');
            if (main) main.classList.toggle('expanded');
            if (sidebar.classList.contains('hidden')) { if (floatBtn) floatBtn.style.display = 'flex'; } 
            else { if (floatBtn) floatBtn.style.display = 'none'; }

    window.toggleLoginDock = function(dockNum, btn) {
        if (loginSelectedDocks.includes(dockNum)) {
            loginSelectedDocks = loginSelectedDocks.filter(d => d !== dockNum);
            btn.classList.remove('selected');
        } else {
            loginSelectedDocks.push(dockNum);
            btn.classList.add('selected');
        }
        
        const label = document.getElementById('assignedDocksLabel');
        if(label) {
            if(loginSelectedDocks.length > 0) {
                label.innerText = loginSelectedDocks.length + " " + tr("Docks Selected");
                label.style.color = "#fff";
            } else {
                label.innerText = tr("Assigned Docks *");
                label.style.color = "var(--text-muted)";
            }

    };

        currentLoginMode = mode;

        const setDisp = (id, display) => { const el = document.getElementById(id); if (el) el.style.display = display; };

        setDisp('loginIdWrapper', (mode === 'admin') ? 'none' : 'block');
        setDisp('loginDocksContainer', (mode === 'admin') ? 'none' : 'block');
        setDisp('adminPasswordContainer', (mode === 'admin') ? 'block' : 'none');

    function populateCheckInDocks(role, docksArray) {
        const dockSelect = document.getElementById('dockNumber');
        if (!dockSelect) return;
        
        dockSelect.innerHTML = `<option value="" disabled selected>${tr('Select Dock...')}</option>`;
        let docksToRender = [];
        
        if (role === 'admin' || !docksArray || docksArray.length === 0) {
            for (let i = 15; i <= 90; i++) docksToRender.push(i);
        } else {
            docksToRender = docksArray.sort((a, b) => a - b);
        }
        
        docksToRender.forEach(d => { dockSelect.innerHTML += `<option value="${d}">${d}</option>`; });
        dockSelect.innerHTML += `<option value="Others">${tr('Others / آخر')}</option>`;
        
        const customInput = document.getElementById('dockNumberCustom');
        if (customInput) customInput.style.display = 'none';
    }

    function executeLogin(name, email, noonId, role, isInitialLoad = false, assignedDocks = []) {
        loggedInUser = { name, email, noonId }; userRole = role;
        
        if (!isInitialLoad) {
            localStorage.setItem('noonSlpUserSession', JSON.stringify({ name, email, noonId, role, assignedDocks, loginTime: Date.now() }));
        }

        populateCheckInDocks(role, assignedDocks);

        const setDisp = (id, display) => { const el = document.getElementById(id); if (el) el.style.display = display; };
        setDisp('nav-dashboard', (role === 'admin') ? 'flex' : 'none');
        setDisp('nav-analytics', (role === 'admin') ? 'flex' : 'none');
        setDisp('nav-checkin', (role === 'admin' || role === 'guard') ? 'flex' : 'none');
        setDisp('nav-active-trucks', (role === 'admin' || role === 'guard') ? 'flex' : 'none');
        setDisp('nav-history', (role === 'admin') ? 'flex' : 'none');
        setDisp('nav-drivers', (role === 'admin') ? 'flex' : 'none');
        setDisp('nav-security', (role === 'admin') ? 'flex' : 'none');
        setDisp('btnExportExcel', (role === 'admin') ? 'block' : 'none');

        if (role === 'guard') {
            const secName = document.getElementById('securityNameField');
            const secId = document.getElementById('securityNameId');
            if (secName) secName.value = name;
            if (secId) secId.value = noonId;
        }

        const overlay = document.getElementById('introOverlay');
        const defaultViewId = (role === 'admin') ? 'dashboard' : 'checkin';
        let navItems = Array.from(document.querySelectorAll('.nav-item'));
        const defaultNavId = navItems.find(el => el.getAttribute('onclick') && el.getAttribute('onclick').includes(defaultViewId));

        if (isInitialLoad) {
            if (overlay) { overlay.style.display = 'none'; overlay.classList.add('hidden'); }
            switchView(defaultViewId, defaultNavId);
        } else {
            setDisp('customLoginBox', 'none');
            const tabs = document.querySelector('.login-tabs'); if (tabs) tabs.style.display = 'none';
            setDisp('authStatus', 'block');
            setTimeout(() => {
                const authText = document.getElementById('authText');
                if (authText) { authText.innerText = "SYSTEM AUTHENTICATION COMPLETE"; authText.style.color = "var(--success-color)"; authText.classList.remove('pulsing'); }
                setTimeout(() => {
                    if (overlay) overlay.classList.add('hidden');
                    setTimeout(() => {
                        if (overlay) overlay.style.display = 'none';
                        switchView(defaultViewId, defaultNavId);
                    }, 1000);
                }, 1200);
            }, 1200);
        }
        
        if (window.hasFetchedLogs && globalLogsCache) {
            compileDriversRegistryCards();
            compileSecurityRegistryCards();
        }
    }

    // --- LOGOUT LOGIC W/ ACTIVE TRUCK BLOCKER ---
    window.logoutUser = function() {
        if (userRole === 'guard' && loginSelectedDocks && loginSelectedDocks.length > 0) {
            let myActiveTrucks = globalLogsCache.filter(r => !r.checkOutTime && loginSelectedDocks.some(d => String(d) === String(r.dockNumber).trim()));
            if (myActiveTrucks.length > 0) {
                alert(tr("You cannot log out. You must check out your active trucks at your assigned docks first."));
                return;
            }
        }
        localStorage.removeItem('noonSlpUserSession');
        location.reload();
    };

    // --- SHIFT HANDOVER LOGIC ---
    window.openHandoverModal = function() {
        if (userRole !== 'guard' || !loginSelectedDocks || loginSelectedDocks.length === 0) {
            alert(tr("Only guards with assigned docks can perform a shift handover."));
            return;
        }
        
        let myActiveTrucks = globalLogsCache.filter(r => !r.checkOutTime && loginSelectedDocks.some(d => String(d) === String(r.dockNumber).trim()));
        
        if (myActiveTrucks.length === 0) {
            alert(tr("Your assigned docks are completely clear. No handover required. You may sign out."));
            return;
        }

        const countEl = document.getElementById('handoverTruckCount');
        if (countEl) countEl.innerText = myActiveTrucks.length;
        document.getElementById('handoverModal').classList.add('modal-active');
    };

    window.closeHandoverModal = function() {
        document.getElementById('handoverModal').classList.remove('modal-active');
    };

    window.confirmHandover = function() {
        const newName = document.getElementById('handoverNewName').value.trim();
        const newId = document.getElementById('handoverNewId').value.trim();

        if (!newName || !newId) {
            alert(tr("Please enter the incoming guard's Name and ID."));
            return;
        }

        const btn = document.getElementById('btnConfirmHandover');
        btn.innerText = "⏳..."; 
        btn.disabled = true;

        const payload = {
            action: 'handover',
            assignedDocks: loginSelectedDocks,
            newGuardName: newName,
            newGuardId: newId
        };

        // Optimistic UI Update
        let myActiveTrucks = globalLogsCache.filter(r => !r.checkOutTime && loginSelectedDocks.some(d => String(d) === String(r.dockNumber).trim()));
        myActiveTrucks.forEach(t => {
            t.securityName = t.securityName + " / " + newName;
            t.securityId = newId;
        });
        window.handleLogsResponse({logs: globalLogsCache});

        // Backend Update
        fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) }).catch(e => console.error(e));

        // Seamless Switch Local Session
        loggedInUser.name = newName;
        loggedInUser.noonId = newId;
        localStorage.setItem('noonSlpUserSession', JSON.stringify({
            name: newName,
            email: loggedInUser.email,
            noonId: newId,
            role: userRole,
            assignedDocks: loginSelectedDocks,
            loginTime: Date.now()
        }));

        // Update Check-In Forms
        const secNameField = document.getElementById('securityNameField');
        const secIdField = document.getElementById('securityNameId');
        if (secNameField) secNameField.value = newName;
        if (secIdField) secIdField.value = newId;

        // Close Modal
        document.getElementById('handoverModal').classList.remove('modal-active');
        btn.innerText = "CONFIRM TRANSFER"; 
        btn.disabled = false;
        document.getElementById('handoverNewName').value = '';
        document.getElementById('handoverNewId').value = '';

        alert(currentLang === 'ar' ? `تم نقل المناوبة بنجاح! أنت الآن مسجل الدخول باسم ${newName}.` : `Shift transferred successfully! You are now logged in as ${newName}.`);
    };

    function playAlarm() {
        if (!window.audioCtx) window.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let count = 0;
        alarmInterval = setInterval(() => {
            if(count >= 10) { clearInterval(alarmInterval); return; } 
            let osc = window.audioCtx.createOscillator();
            let gainNode = window.audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(800, window.audioCtx.currentTime);
            gainNode.gain.setValueAtTime(0.2, window.audioCtx.currentTime);
            osc.connect(gainNode);
            gainNode.connect(window.audioCtx.destination);
            osc.start();
            osc.stop(window.audioCtx.currentTime + 0.3); 
            count++;
        }, 1000);
    }

    function stopAlarm() {
        if (alarmInterval) clearInterval(alarmInterval);
    }

    function processAlertQueue() {
        if (window.isAlertModalOpen || window.alertQueue.length === 0) return;
        let nextAlert = window.alertQueue.shift();
        window.isAlertModalOpen = true;
        window.currentAlert = nextAlert; 
        
        if (nextAlert.type === 'prompt') {
            const msgEl = document.getElementById('timerAlertMessage');
            msgEl.innerHTML = `${tr('Dock')} ${nextAlert.truck.dockNumber} ${tr('has been active for ')} ${nextAlert.mins} ${tr(' minutes.')}`;
            
            if (nextAlert.hasFuse) {
                msgEl.innerHTML += `<br><br><span style="color:var(--danger-color); font-size: 1rem; font-weight: 800;">⚠️ Auto-Checkout in <span id="fuseTimer">60</span>s!</span>`;
                let timeLeft = 60;
                window.currentFuseInterval = setInterval(() => {
                    timeLeft--;
                    let fuseEl = document.getElementById('fuseTimer');
                    if (fuseEl) fuseEl.innerText = timeLeft;
                    if (timeLeft <= 0) {
                        clearInterval(window.currentFuseInterval);
                        closeAlertModal(false);
                        triggerAutoCheckout(nextAlert.truck);
                    }
                }, 1000);
            }
            
            const extendBtn = document.getElementById('btnExtendTimer');
            if(extendBtn) {
                extendBtn.onclick = () => {
                    if (window.currentFuseInterval) clearInterval(window.currentFuseInterval);
                    
                    // Update exact count in local storage
                    window.truckExtensions[nextAlert.truck.plateNumber] = (window.truckExtensions[nextAlert.truck.plateNumber] || 0) + 1;
                    localStorage.setItem('noonSlpExtensions', JSON.stringify(window.truckExtensions));
                    closeAlertModal(true);
                };
            }
            
            const checkoutBtn = document.getElementById('btnCheckoutTimer');
            if(checkoutBtn) {
                checkoutBtn.onclick = () => {
                    if (window.currentFuseInterval) clearInterval(window.currentFuseInterval);
                    closeAlertModal(true);
                    promptSignOut(nextAlert.truck.driverName, nextAlert.truck.plateNumber, nextAlert.truck.securityName, nextAlert.truck.dockNumber, nextAlert.truck.dispatchType);
                };
            }
            
            document.getElementById('timerAlertModal').classList.add('modal-active');
            playAlarm();
        } 
        else if (nextAlert.type === 'auto') {
            const msgEl = document.getElementById('autoWarningMessage');
            if(msgEl) msgEl.innerText = `${tr('Dock')} ${nextAlert.truck.dockNumber} ${tr('Auto-checked out.')} Do not leave the dock; extend every 30 mins.`;
            document.getElementById('autoCheckoutWarningModal').classList.add('modal-active');
            playAlarm();
        }
    }

    function triggerAutoCheckout(truck) {
        // Clear active alert if it belongs to this truck
        if (window.currentFuseInterval) clearInterval(window.currentFuseInterval);

        if (window.isAlertModalOpen && window.currentAlert && window.currentAlert.truck.plateNumber === truck.plateNumber && window.currentAlert.type === 'prompt') {
            document.getElementById('timerAlertModal').classList.remove('modal-active');
            stopAlarm();
            window.isAlertModalOpen = false;
            window.currentAlert = null;
        }

        let match = globalLogsCache.find(r => String(r.plateNumber) === String(truck.plateNumber) && !r.checkOutTime);
        if (match) { 
            match.checkOutTime = new Date().toISOString(); 
            match.sealNumber = "AUTO-CHECKOUT"; 
        }
        window.handleLogsResponse({logs: globalLogsCache});

        const payload = { 
            action: "checkout", 
            driverName: truck.driverName, 
            plateNumber: truck.plateNumber, 
            sealNumber: "AUTO-CHECKOUT", 
            truckPhoto: "", 
            itemPhoto: "" 
        };
        fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });

        // Clean up extensions when completely checked out
        delete window.truckExtensions[truck.plateNumber];
        localStorage.setItem('noonSlpExtensions', JSON.stringify(window.truckExtensions));

        window.alertQueue.push({ type: 'auto', truck: truck });
        processAlertQueue();
    }

    // MAIN TIMER ENGINE (Runs every 5 seconds)
    setInterval(() => {
        if (userRole !== 'guard' || !loginSelectedDocks || loginSelectedDocks.length === 0) return;
        
        const now = Date.now();
        const activeTrucks = globalLogsCache.filter(r => !r.checkOutTime);
        
        for (let t of activeTrucks) {
            // Only monitor the logged-in guard's assigned docks
            if (!loginSelectedDocks.some(d => String(d) === String(t.dockNumber).trim())) continue;
            
            let checkInMs = parseFlexibleDate(t.checkInTime).getTime();
            if (isNaN(checkInMs)) continue;
            
            let elapsedMins = (now - checkInMs) / 60000;
            
            // STRICTLY fetch from LocalStorage memory
            let extCount = window.truckExtensions[t.plateNumber] || 0;
            let currentLimit = 30 + (extCount * 30);
            
            // GRACE PERIOD EXPIRATION (1 min after prompt) -> AUTO CHECKOUT
            if (elapsedMins >= currentLimit + 1) {
                if (window.truckAlerting[t.plateNumber] === 'auto') continue;
                window.truckAlerting[t.plateNumber] = 'auto';
                triggerAutoCheckout(t);
                continue;
            }
            
            // EXACT PROMPT TRIGGER
            if (elapsedMins >= currentLimit && elapsedMins < currentLimit + 1) {
                let alertKey = currentLimit;
                if (window.truckAlerting[t.plateNumber] !== alertKey && window.truckAlerting[t.plateNumber] !== 'auto') {
                    window.truckAlerting[t.plateNumber] = alertKey; 
                    window.alertQueue.push({ 
                        type: 'prompt', 
                        truck: t, 
                        mins: alertMins,
                        hasFuse: true // Activates the 60s warning text
                    });
                    processAlertQueue();
                }
            }
        }
    }, 5000);

                window.syncLockUntil = Date.now() + 15000;

                let match = globalLogsCache.find(r => String(r.plateNumber) === String(currentSignOutContext.plateNumber) && !r.checkOutTime);

    let isFetchingLogs = false;
    function fetchLogs() {
        if (Date.now() < window.syncLockUntil) return;
        if (isFetchingLogs || window.isSavingEdit) return; 
        isFetchingLogs = true;

        fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'getLogs' }) })
        .then(response => response.json())
        .then(data => {
            isFetchingLogs = false;
            if (Date.now() < window.syncLockUntil) return;
            if (data.status === 'error') { console.error(data.message); return; }
            if (typeof window.handleLogsResponse === 'function') window.handleLogsResponse(data);
        }).catch(err => { isFetchingLogs = false; console.error(err); });
    }

    function calculateDurationStr(t1, t2) {
        if (!t1) return "--";
        let start = parseFlexibleDate(t1).getTime();
        let end = t2 ? parseFlexibleDate(t2).getTime() : Date.now();
        let diff = end - start;
        if (diff < 0 || isNaN(diff)) return "0h 0m";
        let mins = Math.floor(diff / 60000);
        let h = Math.floor(mins / 60);
        let m = mins % 60;
        return `${h}h ${m}m`;
    }

    function generatePlateBumperUI(plateStr) {
        plateStr = String(plateStr || "").trim();
        if (!plateStr || plateStr === "--" || plateStr === "N/A") { return `<span style="color:#a0a0a0;">N/A</span>`; }
        const parts = plateStr.split(' '), numbers = parts[0] || '', letters = parts.slice(1).join(' ') || '';
        return `<div class="plate-bumper notranslate" translate="no"><span class="plate-num">${numbers}</span><span class="plate-let">${letters}</span></div>`;
    }

    function getBadgeClass(displayDir, isOut) {

        if (displayDir.includes("INBOUND") || displayDir.includes("دخول")) return "badge in";
        if (displayDir.includes("RTV") || displayDir.includes("LQD") || displayDir.includes("LIQUIDATION")) return "badge purple";
        return "badge blue";
    }

    window.handleLogsResponse = function(responsePayload) {

            let allDocksToRender = new Set();

        let activeHtml = '';

    window.applyAnalyticsFilters = debounce(function() {
        let range = currentAnalyticsDateRange;
        const fromEl = document.getElementById('analyticsCustomDateFrom'); const fromStr = fromEl ? fromEl.value : '';
        const toEl = document.getElementById('analyticsCustomDateTo'); const toStr = toEl ? toEl.value : '';
        const input = document.getElementById('analyticsSearchQuery'); let query = input ? input.value.toLowerCase().trim() : '';
        const timeFilterEl = document.getElementById('analyticsTimeFilter'); let timeFilter = timeFilterEl ? timeFilterEl.value : 'both';
        const now = new Date();

        let filtered = globalLogsCache.filter(r => {
            const checkInMatch = isDateInRange(r.checkInTime, range, now, fromStr, toStr);
            const checkOutMatch = r.checkOutTime ? isDateInRange(r.checkOutTime, range, now, fromStr, toStr) : false;
            if (timeFilter === 'in') return checkInMatch;
            if (timeFilter === 'out') return checkOutMatch;
            return checkInMatch || checkOutMatch;
        });

        let unit = 'month', step = 1, diffDays = 0;
        if (range === 'custom' || range === 'all') {
            if (range === 'custom' && fromStr && toStr) { diffDays = (new Date(toStr) - new Date(fromStr)) / (1000 * 60 * 60 * 24); } 
            else if (filtered.length > 0) {
                let times = filtered.map(r => parseFlexibleDate(r.checkInTime).getTime()).filter(t => !isNaN(t));
                if (times.length > 0) diffDays = (Math.max(...times) - Math.min(...times)) / (1000 * 60 * 60 * 24);
            }
        }

        if (range === 'today' || ((range === 'custom' || range === 'all') && diffDays <= 1)) { unit = 'hour'; step = 1; } 
        else if (range === 'weekly' || range === '7days' || ((range === 'custom' || range === 'all') && diffDays <= 14)) { unit = 'day'; step = 1; } 
        else if (range === 'monthly' || ((range === 'custom' || range === 'all') && diffDays <= 60)) { unit = 'week'; step = 1; } 
        else if (range === '6months' || ((range === 'custom' || range === 'all') && diffDays <= 180)) { unit = 'month'; step = 1; } 
        else if (range === '1year' || ((range === 'custom' || range === 'all') && diffDays <= 365)) { unit = 'month'; step = 1; } 
        else if (range === 'all' || (range === 'custom' && diffDays > 365)) { unit = 'month'; step = 3; }

        let growthMap = {};
        filtered.forEach(log => {
            let time = parseFlexibleDate(log.checkInTime);
            if (!isNaN(time.getTime())) {
                let key;
                if (unit === 'hour') key = `${time.getFullYear()}-${String(time.getMonth() + 1).padStart(2, '0')}-${String(time.getDate()).padStart(2, '0')}T${String(time.getHours()).padStart(2, '0')}:00:00`;
                else if (unit === 'day') key = `${time.getFullYear()}-${String(time.getMonth() + 1).padStart(2, '0')}-${String(time.getDate()).padStart(2, '0')}T00:00:00`;
                else if (unit === 'week') { let d = new Date(time); d.setHours(0,0,0,0); d.setDate(d.getDate() - d.getDay()); key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}T00:00:00`; } 
                else { key = `${time.getFullYear()}-${String(time.getMonth() + 1).padStart(2, '0')}-01T00:00:00`; }
                if (!growthMap[key]) growthMap[key] = 0;
                growthMap[key]++;
            }
        });

        let growthData = Object.keys(growthMap).map(k => ({ x: k, y: growthMap[k] })).sort((a, b) => a.x.localeCompare(b.x));

        if (growthData.length === 1) {
            let singleDate = new Date(growthData[0].x);
            if (unit === 'hour') singleDate.setHours(singleDate.getHours() - 1);
            else if (unit === 'day') singleDate.setDate(singleDate.getDate() - 1);
            else if (unit === 'week') singleDate.setDate(singleDate.getDate() - 7);
            else singleDate.setMonth(singleDate.getMonth() - 1);
            let dummyX = `${singleDate.getFullYear()}-${String(singleDate.getMonth() + 1).padStart(2, '0')}-${String(singleDate.getDate()).padStart(2, '0')}T${String(singleDate.getHours()).padStart(2, '0')}:00:00`;
            growthData.unshift({ x: dummyX, y: 0 });
        }

        const lineCont = document.getElementById('chartGrowthLine');
        if (lineCont) {
            lineCont.innerHTML = '<div style="position: relative; height: 220px; width: 100%;"><canvas id="growthChartCanvas"></canvas></div>';
            if (window.myGrowthChart) window.myGrowthChart.destroy();
            const ctx = document.getElementById('growthChartCanvas').getContext('2d');
            window.myGrowthChart = new Chart(ctx, {
                type: 'line', data: { datasets: [{ data: growthData, borderColor: '#ffc107', backgroundColor: '#1a1c23', pointBackgroundColor: '#1a1c23', pointBorderColor: '#ffc107', pointBorderWidth: 2, pointRadius: 5, pointHoverRadius: 7, borderWidth: 3, tension: 0 }] },
                options: { responsive: true, maintainAspectRatio: false, layout: { padding: { top: 25, left: 15, right: 15 } }, plugins: { legend: { display: false }, datalabels: { color: '#ffffff', align: 'top', offset: 6, font: { weight: 'bold', size: 12 }, formatter: function(value) { return value.y > 0 ? value.y : ""; } } }, scales: { x: { type: 'time', time: { unit: unit, stepSize: step, displayFormats: { hour: 'HH:mm', day: 'MMM d', week: 'MMM d', month: 'MMM yyyy' } }, grid: { display: false, drawBorder: false }, ticks: { color: '#888', font: { size: 11 }, maxRotation: 0, autoSkip: true, maxTicksLimit: 8 } }, y: { display: false, min: 0, grace: '20%' } } }
            });
        }

        let hourMap = {};
        filtered.forEach(log => {
            let time = parseFlexibleDate(log.checkInTime);
            if (!isNaN(time.getTime())) {
                let hour = time.getHours(), ampm = hour >= 12 ? 'PM' : 'AM', hourLabel = `${hour % 12 || 12} ${ampm}`;
                if (!hourMap[hourLabel]) hourMap[hourLabel] = { count: 0, rawHr: hour };
                hourMap[hourLabel].count++;

        let hourData = Object.keys(hourMap).map(k => ({ label: k, count: hourMap[k].count, rawHr: hourMap[k].rawHr })).sort((a, b) => a.rawHr - b.rawHr);
        const hoursCont = document.getElementById('chartHoursColumns');
        if (hoursCont) {

            else {
                let maxH = Math.max(...hourData.map(item => item.count)); if(maxH === 0) maxH = 1;
                let hHtml = `<div style="display:flex; align-items:flex-end; justify-content:space-around; height:180px; padding-bottom:30px; border-bottom:2px solid rgba(255,255,255,0.05); border-left:2px solid rgba(255,255,255,0.05); position:relative; margin-top:1rem; padding-left: 10px;">`;
                hourData.slice(0, 7).forEach((item, idx) => {
                    let c = chartColors[idx % chartColors.length];
                    let heightPct = (item.count / maxH) * 100;
                    hHtml += `<div style="display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; width:40px; position:relative;"><div style="font-size:0.9rem; color:#fff; font-weight:800; margin-bottom:8px;">${item.count}</div><div style="width:100%; background:${c}; height:${heightPct}%; border-radius:4px 4px 0 0;"></div><div style="position:absolute; bottom:-25px; font-size:0.7rem; color:var(--text-muted); font-weight:700; white-space:nowrap;">${item.label}</div></div>`;

        let cohortMap = {};

        });
        let cohortData = Object.keys(cohortMap).map(k => ({ label: k, count: cohortMap[k] })).sort((a,b) => b.count - a.count);
        const barsCont = document.getElementById('chartCohortsBars');
        if (barsCont) {
            if(cohortData.length === 0) { barsCont.innerHTML = "<div style='color:var(--text-muted);text-align:center;'>No Data</div>"; } else {
                let maxC = Math.max(...cohortData.map(d=>d.count)); if(maxC===0) maxC=1;
                let bHtml = '';
                cohortData.slice(0,5).forEach((d, idx) => {
                    let c = chartColors[idx % chartColors.length];
                    bHtml += `<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;"><div style="width:85px; font-size:0.65rem; font-weight:700; color:var(--text-muted); text-align:right;">${d.label}</div><div style="flex-grow:1; background:rgba(255,255,255,0.05); height:20px; border-radius:4px; margin:0 10px; overflow:hidden;"><div style="width:${(d.count/maxC)*100}%; background:${c}; height:100%;"></div></div><div style="font-size:0.75rem; font-weight:bold; color:#fff;">${d.count}</div></div>`;
                });
                barsCont.innerHTML = bHtml;
            }
        }

        let dockMap = {};
        filtered.forEach(log => { let dock = log.dockNumber; if (dock) dockMap[dock] = (dockMap[dock] || 0) + 1; });
        let dockData = Object.keys(dockMap).map(k => ({ label: k, count: dockMap[k] })).sort((a,b) => b.count - a.count);
        let total = dockData.reduce((sum, item) => sum + item.count, 0);

        const aTables = document.getElementById('analyticsGroupedTables');

        const timeFilterEl = document.getElementById('historyTimeFilter'); let timeFilter = timeFilterEl ? timeFilterEl.value : 'both';
        const now = new Date();

        let filtered = globalLogsCache.filter(r => {
            const checkInMatch = isDateInRange(r.checkInTime, range, now, fromStr, toStr);
            const checkOutMatch = r.checkOutTime ? isDateInRange(r.checkOutTime, range, now, fromStr, toStr) : false;
            if (timeFilter === 'in') return checkInMatch;
            if (timeFilter === 'out') return checkOutMatch;

        let html = ''; let count = 0;

    function convertArabicNumeralsToDigits(str) {
        const map = {'٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9'};

    function loadImageRobust(file) {
        return new Promise((resolve, reject) => { const img = new Image(); img.onload = () => resolve(img); img.onerror = () => reject(new Error('Image failed to load')); img.src = URL.createObjectURL(file); });
    }

    async function preprocessImageForOcr(file, scanType, forceFullFrame = false) {
        const img = await loadImageRobust(file);
        const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d', { alpha: false });
        const isAlreadyCropped = (img.width / img.height) > 1.8;
        if (scanType === 'PLATE' && !forceFullFrame && !isAlreadyCropped) {
            const cropX = img.width * 0.05, cropY = img.height * 0.25, cropW = img.width * 0.90, cropH = img.height * 0.75; 
            canvas.width = Math.min(1600, Math.round(cropW)); canvas.height = Math.round((cropH / cropW) * canvas.width);
            ctx.drawImage(img, cropX, cropY, cropW, cropH, 0, 0, canvas.width, canvas.height);
        } else {
            const targetWidth = 1600, scale = img.width > targetWidth ? targetWidth / img.width : 1;
            canvas.width = Math.round(img.width * scale); canvas.height = Math.round(img.height * scale);
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        }
        return new Promise((resolve, reject) => { canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('Canvas compression failed')), 'image/jpeg', 0.95); });
    }

    async function createContrastEnhancedOcrBlob(fileBlob) {
        const img = await loadImageRobust(fileBlob);
        const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d', { alpha: false });
        canvas.width = img.width; canvas.height = img.height;
        ctx.filter = 'contrast(110%) brightness(105%)'; ctx.drawImage(img, 0, 0);
        return new Promise(resolve => { canvas.toBlob(blob => resolve(blob || fileBlob), 'image/jpeg', 0.95); });
    }

    function blobToBase64(blob) {
        return new Promise((resolve, reject) => { const reader = new FileReader(); reader.onloadend = () => resolve(reader.result.split(',')[1]); reader.onerror = () => reject(new Error('Blob to Base64 failed')); reader.readAsDataURL(blob); });
    }

        }
        try {
            cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } } });
            const video = document.getElementById('cameraVideo');
            if (video) { video.srcObject = cameraStream; video.setAttribute("playsinline", true); }
        } catch (err) { alert('Camera access failed. Please check permissions.'); closeCamera(); }
    };

    window.toggleCameraTorch = async function() {
        if (!cameraStream) return;
        const track = cameraStream.getVideoTracks()[0]; if (!track) return;
        const torchBtn = document.getElementById('torchToggleBtn');
        try {
            const capabilities = track.getCapabilities ? track.getCapabilities() : {};
            if (capabilities.torch) {
                isTorchOn = !isTorchOn; await track.applyConstraints({ advanced: [{ torch: isTorchOn }] });
                if (torchBtn) { torchBtn.style.background = isTorchOn ? 'var(--accent-color)' : 'rgba(255,255,255,0.15)'; torchBtn.style.color = isTorchOn ? '#000' : '#fff'; }
            } else alert('Flashlight torch not supported on this camera/device.');
        } catch (e) { alert('Unable to toggle flashlight.'); }
    };

    window.openCheckoutCamera = function(statusLabelId, scanType) { window.openCamera(statusLabelId, scanType); };

    window.closeCamera = function() {
        const overlay = document.getElementById('cameraOverlay'); if (overlay) overlay.classList.remove('open');
        if (cameraStream) { cameraStream.getTracks().forEach(t => t.stop()); cameraStream = null; }
    };

    window.captureCameraFrame = function() {
        const video = document.getElementById('cameraVideo'), canvas = document.getElementById('cameraCanvas'), captureBtn = document.getElementById('mainCaptureBtn');
        if (video && !video.paused) {
            if (captureBtn) { captureBtn.innerHTML = `⏳ ${tr('Hold Still...')}`; captureBtn.disabled = true; captureBtn.style.background = '#fff'; }
            setTimeout(() => {
                canvas.width = video.videoWidth; canvas.height = video.videoHeight;
                canvas.getContext('2d', { alpha: false }).drawImage(video, 0, 0, canvas.width, canvas.height);
                const currentStatusId = cameraTargetStatusId, currentScanType = cameraTargetScanType;
                
                canvas.toBlob(blob => {
                    let reader = new FileReader(); reader.readAsDataURL(blob);
                    reader.onloadend = () => { 
                        if (currentScanType === 'truck') { tempCheckoutTruckPhoto = reader.result; const statusEl = document.getElementById(currentStatusId); if (statusEl) { statusEl.innerHTML = "✅ Attached"; statusEl.style.color = "var(--success-color)"; } } 
                        else if (currentScanType === 'TRUCK_PHOTO_ONLY') { window.temporaryCapturedImage = reader.result; const statusEl = document.getElementById(currentStatusId); if (statusEl) { statusEl.innerHTML = "✅ Attached"; statusEl.style.color = "var(--success-color)"; } } 
                        else if (currentScanType === 'item') { tempCheckoutItemPhoto = reader.result; const statusEl = document.getElementById(currentStatusId); if (statusEl) { statusEl.innerHTML = "✅ Attached"; statusEl.style.color = "var(--success-color)"; } } 
                        else if (currentScanType === 'ITEM_PHOTO') { window.temporaryCapturedItemImage = reader.result; const statusEl = document.getElementById(currentStatusId); if (statusEl) { statusEl.innerHTML = "✅ Attached"; statusEl.style.color = "var(--success-color)"; } } 
                        else {
                            if (currentScanType === 'IQAMA') window.temporaryCapturedIqamaImage = reader.result; 
                            else window.temporaryCapturedImage = reader.result;
                            runLocalOcrEngine(blob, currentStatusId, currentScanType); 
                        }
                    };
                }, 'image/jpeg', 0.95); 
                
                if (captureBtn) { captureBtn.innerHTML = `📸 ${tr('Capture')}`; captureBtn.disabled = false; captureBtn.style.background = 'var(--accent-color)'; }
                window.closeCamera();
            }, 800);
        }
    };

    window.handleCameraCancel = function() { window.closeCamera(); };

    let ocrCallbackId = 0;
    function processOcrRequestJSONP(base64Data, scanType) {
        return new Promise((resolve, reject) => {
            const cbName = 'ocr_callback_' + (++ocrCallbackId) + '_' + Date.now();
            const timeout = setTimeout(() => { delete window[cbName]; const script = document.getElementById(cbName); if (script) script.remove(); reject(new Error("OCR Request Timeout")); }, 15000);
            window[cbName] = function(response) { clearTimeout(timeout); delete window[cbName]; const script = document.getElementById(cbName); if (script) script.remove(); resolve(response); };
            const script = document.createElement('script'); script.id = cbName;
            const targetType = scanType === 'LOGIN_OFFICER' ? 'OFFICER' : scanType;
            script.src = `${OCR_API_URL}?callback=${cbName}&scanType=${targetType}&imageObj=${encodeURIComponent(base64Data)}`;
            script.onerror = function() { clearTimeout(timeout); delete window[cbName]; script.remove(); reject(new Error("JSONP Script Error")); };
            document.body.appendChild(script);
        });
    }

    async function processOcrRequest(file, scanType, forceFull = false) {
        const processedBlob = await preprocessImageForOcr(file, scanType, forceFull);
        const enhancedOcrBlob = await createContrastEnhancedOcrBlob(processedBlob);
        const base64Data = await blobToBase64(enhancedOcrBlob);
        try { return await processOcrRequestJSONP(base64Data, scanType); } 
        catch (err) {
            const response = await fetch(OCR_API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ scanType: scanType === 'LOGIN_OFFICER' ? 'OFFICER' : scanType, imageObj: base64Data }) });
            return await response.json();
        }
    }

    async function runLocalOcrEngine(file, statusLabelId, scanType) {
        const status = document.getElementById(statusLabelId); 
        if (status) status.innerHTML = "🌀 Processing OCR...";
        
        try {
            let result = await processOcrRequest(file, scanType, false);
            let rawText = (result && result.text) || "";
            let cleanText = convertArabicNumeralsToDigits(rawText).toUpperCase();
            let cleanTextNoSpaces = cleanText.replace(/\s+/g, '');
            let matched = false;

            if (scanType === "PLATE" && !cleanText.match(/\b\d{3,4}\b/)) {
                result = await processOcrRequest(file, scanType, true);
                rawText = (result && result.text) || ""; cleanText = convertArabicNumeralsToDigits(rawText).toUpperCase(); cleanTextNoSpaces = cleanText.replace(/\s+/g, '');
            }

            if (scanType === "IQAMA") {
                let idMatch = cleanTextNoSpaces.match(/[12]\d{9}/); let idNum = idMatch ? idMatch[0] : "";
                if (idNum) { const iqEl = document.getElementById('iqamaNumber'); if (iqEl) { iqEl.value = idNum; iqEl.dispatchEvent(new Event('input')); } matched = true; }
                let lines = cleanText.split('\n').map(l => l.trim()).filter(Boolean);
                const englishExcludes = /KINGDOM|SAUDI|ARABIA|MINISTRY|INTERIOR|RESIDENT|IDENTITY|NATIONALITY|DRIVING|LICENSE|PERMIT|SPECIAL|VERSION|ISSUE|NUMBER|EXPIRY|BIRTH|OCCUPATION|EMPLOYER|RELIGION|ISLAM|MUSLIM|CHRISTIAN|SERVICES|COPY|REPUBLIC|CARD|OFFICER|ASSOCIATE/i;
                const arabicExcludes = /المملكة|العربية|السعودية|وزارة|الداخلية|بطاقة|الهوية|الوطنية|الرقم|تاريخ|الانتهاء|مكان|الميلاد|جهة|الإصدار|نسخة|تاريخه|الحفظ|رخصة|إقامة|مقيم|هوية|عامل|سائق|الجنسية|المهنة|الديانة|صاحب|العمل|مؤسسة|شركة|للتجارة|للمقاولات|خدمات|الكترونية|الالكترونية|الاسلام|بنجلاديش|باكستان|الهند|مصر|سودان|يمن/;

                let selectedName = "";
                let foundEnglishName = lines.find(line => { let cleanLine = line.replace(/[^A-Z\s.'-]/gi, '').trim(); if (cleanLine.length < 4) return false; if (englishExcludes.test(cleanLine)) return false; let words = cleanLine.split(/\s+/).filter(w => w.length >= 2); return words.length >= 1 && /^[A-Z\s.'-]+$/i.test(cleanLine); });
                if (foundEnglishName) { selectedName = foundEnglishName.replace(/[^A-Z\s.'-]/gi, '').trim().toUpperCase(); } 
                else {
                    let foundArabicName = lines.find(line => { let cleanLine = line.trim(); if (cleanLine.length < 6) return false; if (arabicExcludes.test(cleanLine)) return false; let arabicWords = cleanLine.split(/\s+/).filter(w => w.length >= 2); return arabicWords.length >= 2 && /^[\u0600-\u06FF\s]+$/.test(cleanLine); });
                    if (foundArabicName) { selectedName = foundArabicName.trim(); }
                }

                if (selectedName) { const dNameEl = document.getElementById('driverName'); if (dNameEl) dNameEl.value = selectedName; matched = true; }
            } else if (scanType === "PLATE") {
                let finalDigits = null, finalLetters = null;
                let digitMatches = cleanText.match(/\b\d{3,4}\b/g); if (digitMatches && digitMatches.length > 0) { finalDigits = digitMatches[digitMatches.length - 1]; }
                let allLetterMatches = cleanText.match(/[A-Z]\s*[A-Z]\s*[A-Z]/g);
                if (allLetterMatches) { let cleanedMatches = allLetterMatches.map(m => m.replace(/\s+/g, '')).filter(m => m !== 'KSA' && m !== 'CAR'); if (cleanedMatches.length > 0) { finalLetters = cleanedMatches[cleanedMatches.length - 1]; } }

                if (finalDigits) {
                    const plNumD = document.getElementById('plateNumberDigits'), plNumL = document.getElementById('plateNumberLetters');
                    if (plNumD) plNumD.value = finalDigits; if (plNumL) plNumL.value = finalLetters || ''; 
                    if (plNumD) plNumD.dispatchEvent(new Event('input'));
                    matched = true;
                }
            } else if (scanType === "OFFICER" || scanType === "LOGIN_OFFICER") {
                let badgeMatch = cleanText.match(/LP\d+/i) || cleanText.match(/[A-Z]{2}\d{4}\b/i); let foundId = badgeMatch ? badgeMatch[0] : "";
                let lines = cleanText.split('\n').map(l => l.trim()).filter(Boolean);
                let nameMatch = lines.find(line => /^[A-Z][A-Z\s.']{2,25}$/i.test(line) && !/LP|ASSOCIATE|EVERY|DOORBELL|DAY|AL\s+ABEER|SAUDI|SECURITY|GATEWAY/i.test(line) && !/^(.)\1+$/.test(line.replace(/\s/g,'')));
                let foundName = nameMatch || (foundId ? "Officer #" + foundId : "");

                if (scanType === "OFFICER") {
                    if (foundId) { const el = document.getElementById('securityNameId'); if (el) el.value = foundId; matched = true; }
                    if (foundName) { const el = document.getElementById('securityNameField'); if (el) el.value = foundName; matched = true; }
                } else if (scanType === "LOGIN_OFFICER") {
                    if (foundId) { const el = document.getElementById('loginNoonId'); if (el) el.value = foundId; matched = true; }
                    if (foundName) { const el = document.getElementById('loginName'); if (el) el.value = foundName; matched = true; }
                }
            }

            if (status) { status.innerHTML = matched ? "✅ Extracted — please double-check fields" : "⚠️ Couldn't read image confidently"; status.style.color = matched ? "var(--success-color)" : "#ef4444"; }
        } catch (e) { if (status) { status.innerHTML = "❌ OCR Failed"; status.style.color = "#ef4444"; } }
    }

    window.handleFileSelected = function(inputEl, statusContainerId, scanType) { 
        if (!inputEl.files || !inputEl.files[0]) return; 
        const file = inputEl.files[0];
        
        const reader = new FileReader();
        reader.onloadend = () => { 
            if (scanType === 'ITEM_PHOTO') window.temporaryCapturedItemImage = reader.result; 
            else if (scanType === 'TRUCK_PHOTO_ONLY') window.temporaryCapturedImage = reader.result; 
            else if (scanType === 'IQAMA') window.temporaryCapturedIqamaImage = reader.result;
            else if (scanType === 'PLATE') window.temporaryCapturedImage = reader.result;
            
            const status = document.getElementById(statusContainerId); 
            if (status) { status.innerHTML = "✅ Attached"; status.style.color = "var(--success-color)"; }
        };
        reader.readAsDataURL(file);
        
        if (scanType === 'IQAMA' || scanType === 'PLATE' || scanType === 'OFFICER' || scanType === 'LOGIN_OFFICER') {
            runLocalOcrEngine(file, statusContainerId, scanType);
        }
        inputEl.value = ''; 
    };

    window.exportHistoryToExcel = function() {
        if (!globalLogsCache || globalLogsCache.length === 0) { alert('No data to export.'); return; }
        const headers = ['Driver', 'Iqama Number', 'Plate', 'Direction', 'Dock', 'Noon Employee ID', 'Boxes/Pallets', 'Seal Number', 'Check In Truck', 'Check Out', 'Security'];
        const csvLines = [headers.join(',')];
        globalLogsCache.forEach(r => {
            let dCheckIn = parseFlexibleDate(r.checkInTime); let safeCheckInStr = !isNaN(dCheckIn.getTime()) ? formatEnglishDate(dCheckIn) : r.checkInTime;
            let dCheckOut = r.checkOutTime ? parseFlexibleDate(r.checkOutTime) : null; let safeCheckOutStr = dCheckOut && !isNaN(dCheckOut.getTime()) ? formatEnglishDate(dCheckOut) : (r.checkOutTime || 'Inside');
            const line = [r.driverName || '', r.iqamaNumber || '', r.plateNumber || '', r.direction || '', r.dockNumber || '', r.noonEmployeeId || '', r.boxCount || '0', r.sealNumber || '--', safeCheckInStr, safeCheckOutStr, r.securityName || ''].map(v => `"${String(v).replace(/"/g, '""')}"`).join(',');
            csvLines.push(line);
        });
        const csvContent = csvLines.join('\n'); const blob = new Blob(["\uFEFF" + csvContent], { type: 'text/csv;charset=utf-8;' }); const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = `movement-history-${new Date().toISOString().slice(0, 10)}.csv`; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
    };

    const CURRENT_APP_VERSION = "9.0"; 
    function checkForNewCode() {
        fetch(window.location.href.split('#')[0].split('?')[0] + '?cachebust=' + new Date().getTime(), { cache: 'no-store' })
            .then(r => r.text())
            .then(html => { const match = html.match(/const CURRENT_APP_VERSION = "([^"]+)";/); if (match && match[1] !== CURRENT_APP_VERSION) { const btn = document.getElementById('updateAppBtn'); if (btn) btn.style.display = 'flex'; } }).catch(() => { });
    }
</script>
